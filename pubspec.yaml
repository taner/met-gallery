name: met_gallery
description: "Search the Met's open-access collection and browse the results as a gallery."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.2
  flutter_hooks:
  freezed_annotation: ^3.1.0
  hooks_riverpod: ^3.4.2
  infinite_scroll_pagination: ^5.1.1
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.6
  shared_preferences: ^2.5.6
  skeletonizer: ^3.0.0
  url_launcher: ^6.3.3
  material_ui: ^1.11.0

dev_dependencies:
  build_runner:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.8

flutter:
  uses-material-design: true


  assets:
    - .env

  fonts:
    - family: Spectral
      fonts:
        - asset: assets/fonts/Spectral-Regular.ttf
        - asset: assets/fonts/Spectral-Italic.ttf
          style: italic
        - asset: assets/fonts/Spectral-SemiBold.ttf
          weight: 600
