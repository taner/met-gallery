include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_const_declarations: true
    prefer_const_constructors_in_immutables: true
    prefer_relative_imports: true

# riverpod_lint runs on the analysis_server_plugin system and is installed
# here, not through pubspec:
# https://riverpod.dev/docs/introduction/getting_started#enabling-riverpod_lint
plugins:
  riverpod_lint: ^3.2.0

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - web/**
